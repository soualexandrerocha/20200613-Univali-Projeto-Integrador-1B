# Coleta automática dos níveis da telemetria da Defesa Civil de Itajaí e
# regeneração do painel pagina/berco2.html com as leituras novas.
# O site só publica as últimas 12 h; rodando a cada 6 h, as janelas se
# sobrepõem e a série fica contínua. Cada execução grava um arquivo novo em
# dados/niveis/ (nenhum arquivo é editado depois), o que evita conflitos.
# Só este workflow commita dados/niveis/ e pagina/berco2.html (ver CLAUDE.md).
# Agendamentos (schedule) só rodam na branch padrão do repositório.
name: Coleta de níveis (Defesa Civil de Itajaí)

on:
  schedule:
    - cron: '17 */6 * * *'  # UTC; minuto 17 para fugir do pico do início da hora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-niveis
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/coleta-niveis.yml

      - name: Instalar dependências da coleta
        run: pip install numpy

      - name: Baixar e acumular leituras
        id: coleta
        run: |
          python analise_propagacao_mare.py --so-coletar
          if [ -z "$(git status --porcelain -- dados/)" ]; then
            echo "novas=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma leitura nova."
          else
            echo "novas=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependências do painel
        if: steps.coleta.outputs.novas == 'true'
        run: pip install utide plotly

      - name: Regenerar o painel do Berço 2
        if: steps.coleta.outputs.novas == 'true'
        run: |
          python ferramentas/gerar_painel_berco2.py
          rm -f cisalhamento_berco2_zp21.html

      - name: Commitar leituras e painel
        if: steps.coleta.outputs.novas == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados/ pagina/berco2.html
          git commit -m "Coleta de níveis $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
